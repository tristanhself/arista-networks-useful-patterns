! Command: show running-config
! device: leaf4b (vEOS-lab, EOS-4.35.4M)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname leaf4b
ip host cvx1 192.168.100.11
ip host cvx2 192.168.100.12
ip host cvx3 192.168.100.13
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
no vlan 1
!
vlan 200
   name TESTVLAN1
!
vlan 4094
   name MLAG
   trunk group MLAG
!
management cvx
   no shutdown
   server host cvx3
   server host cvx1
   server host cvx2
   source-interface Loopback0
!
interface Port-Channel3
   description MLAG_leaf4a
   switchport mode trunk
   switchport trunk group MLAG
!
interface Port-Channel5
   description SERVER-PC9-BOND1
   switchport trunk native vlan 200
   switchport mode trunk
   mlag 5
   spanning-tree portfast edge
!
interface Ethernet1
   description uplink-spine1a
   no switchport
   ip address 192.168.1.17/30
!
interface Ethernet2
!
interface Ethernet3
   description MLAG-leaf4a-eth3
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG-leaf4a-eth4
   channel-group 3 mode active
!
interface Ethernet5
   description SERVER-PC9-NIC2
   channel-group 5 mode active
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
!
interface Loopback0
   ip address 10.255.0.4/32
!
interface Management1
!
interface Vlan4094
   description MLAG
   mtu 1500
   no autostate
   ip address 10.255.1.65/31
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan controller-client
   vxlan udp-port 4789
   vxlan vlan 200 vni 10200
!
ip routing
!
mlag configuration
   domain-id L3_LEAF4
   local-interface Vlan4094
   peer-address 10.255.1.64
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route 0.0.0.0/0 192.168.1.18
!
end
