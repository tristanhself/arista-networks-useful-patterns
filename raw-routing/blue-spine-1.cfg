! Command: show running-config
! device: blue-spine-1 (vEOS-lab, EOS-4.35.4M)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname blue-spine-1
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
no vlan 1
!
interface Ethernet1
   description 1a-e1_bs1-e1
   no switchport
   ip address 10.254.0.2/30
!
interface Ethernet2
   description 1b-e1_bs1-e2
   no switchport
   ip address 10.254.0.10/30
!
interface Ethernet3
   description 2a-e1_bs1-e3
   no switchport
   ip address 10.254.0.18/30
!
interface Ethernet4
   description 2b-e1_bs1-e4
   no switchport
   ip address 10.254.0.26/30
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
!
interface Loopback0
   ip address 10.255.0.1/32
!
interface Management1
!
ip routing
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bgp 65200
   router-id 10.255.0.1
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.254.0.1 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.1 remote-as 65101
   neighbor 10.254.0.1 description 1a-e1_bs1-e1
   neighbor 10.254.0.9 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.9 remote-as 65101
   neighbor 10.254.0.9 description 1b-e1_bs1-e2
   neighbor 10.254.0.17 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.17 remote-as 65102
   neighbor 10.254.0.17 description 2a-e1_bs1-e3
   neighbor 10.254.0.25 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.25 remote-as 65102
   neighbor 10.254.0.25 description 2b-e1_bs1-e4
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!