! Command: show running-config
! device: leaf2b (vEOS-lab, EOS-4.35.4M)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname leaf2b
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
no vlan 1
!
vlan 102
   name TESTVLAN3
!
vlan 4093
   name MLAG_iBGP_Peering
   trunk group iBGPL3LEAFPEER
!
vlan 4094
   name MLAG_Peer
   trunk group MLAGPEER
!
interface Port-Channel3
   description MLAG_leaf2a
   switchport mode trunk
   switchport trunk group MLAGPEER
   switchport trunk group iBGPL3LEAFPEER
!
interface Port-Channel5
   description HOST3-BOND1
   switchport access vlan 102
   mlag 5
   spanning-tree portfast edge
!
interface Port-Channel6
   description HOST4-BOND1
   switchport access vlan 102
   mlag 6
   spanning-tree portfast edge
!
interface Ethernet1
   description 2b-e1_bs1-e4
   no switchport
   ip address 10.254.0.25/30
!
interface Ethernet2
   description 2b-e2_bs2-e4
   no switchport
   ip address 10.254.0.29/30
!
interface Ethernet3
   description MLAG-leaf2a-eth3
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG-leaf2a-eth4
   channel-group 3 mode active
!
interface Ethernet5
   description HOST3-NIC1
   channel-group 5 mode active
!
interface Ethernet6
   description HOST4-NIC1
   channel-group 6 mode active
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
!
interface Loopback0
   ip address 10.255.0.6/32
!
interface Management1
!
interface Vlan102
   description TESTVLAN3
   ip address 172.16.2.3/24
   ip virtual-router address 172.16.2.1
!
interface Vlan4093
   description MLAG_iBGP_Peering
   ip address 10.252.0.6/30
!
interface Vlan4094
   description MLAG_Peer
   ip address 10.253.0.6/30
!
ip virtual-router mac-address 00:1c:73:00:00:98
!
ip routing
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/24 eq 32
   seq 20 permit 172.16.2.0/24 eq 24
!
mlag configuration
   domain-id LEAF2AB
   local-interface Vlan4094
   peer-address 10.253.0.5
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bgp 65102
   router-id 10.255.0.6
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65102
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description MLAG_iBGP_Peering_leaf2a
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.252.0.5 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.252.0.5 description MLAG_iBGP_Peering_leaf2a
   neighbor 10.254.0.26 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.26 remote-as 65200
   neighbor 10.254.0.26 description 2b-e1_bs1-e4
   neighbor 10.254.0.30 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.30 remote-as 65200
   neighbor 10.254.0.30 description 2b-e2_bs2-e4
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
!